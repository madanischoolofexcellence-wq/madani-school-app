name: Build Android APK + Windows app
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Capacitor Android project
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MadaniSchool.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MadaniSchool.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Check the ZKBio database reader works inside the app
        run: npx electron sqlite-check.js
      - name: Set version from build number (used by auto-update)
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/MadaniSchool-Setup.exe
            desktop/dist/latest.yml

  release:
    # Only builds from main are published; other branches just keep the build artifacts.
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release delete apk-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create apk-latest out/MadaniSchool.apk out/MadaniSchool-Setup.exe out/latest.yml \
            --repo "${{ github.repository }}" \
            --latest \
            --title "Madani School — Android & Windows App (1.0.${{ github.run_number }})" \
            --notes "Public download — no login needed.
          - Android: tap MadaniSchool.apk to install.
          - Windows PC: download MadaniSchool-Setup.exe and run it. The app updates itself automatically, and on a school PC it syncs the fingerprint device."
